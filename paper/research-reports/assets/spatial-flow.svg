<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 226" role="img"><title>영상의 공간 대응</title><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect width="960" height="226" rx="18" fill="#f3f7fa"/><rect x="0" y="20" width="6" height="186" rx="3" fill="#176c70"/><text x="28" y="46" font-size="26" font-weight="700" fill="#1e3044">영상의 공간 대응</text><text x="28" y="77" font-size="15" font-weight="400" fill="#1e3044">절차 도식 · 원본에서 관심 영역과 모델 입력까지</text><rect x="28" y="110" width="204" height="90" rx="10" fill="white" stroke="#176c70"/><text x="42" y="143" font-size="20" font-weight="700" fill="#176c70">원본 프레임</text><text x="42" y="171" font-size="14" font-weight="400" fill="#1e3044">정확한 프레임과 PTS</text><text x="238" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="262" y="110" width="204" height="90" rx="10" fill="white" stroke="#3668a8"/><text x="276" y="143" font-size="20" font-weight="700" fill="#3668a8">카메라 ROI</text><text x="276" y="171" font-size="14" font-weight="400" fill="#1e3044">원근 보정 좌표</text><text x="472" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="496" y="110" width="204" height="90" rx="10" fill="white" stroke="#806391"/><text x="510" y="143" font-size="20" font-weight="700" fill="#806391">점·상자·마스크</text><text x="510" y="171" font-size="14" font-weight="400" fill="#1e3044">서로 다른 기하 정보</text><text x="706" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="730" y="110" width="204" height="90" rx="10" fill="white" stroke="#a65139"/><text x="744" y="143" font-size="20" font-weight="700" fill="#a65139">국소 Crop</text><text x="744" y="171" font-size="14" font-weight="400" fill="#1e3044">픽셀 범위와 가림</text></g></svg>
