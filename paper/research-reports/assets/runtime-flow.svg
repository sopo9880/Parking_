<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 226" role="img"><title>실시간 입력과 게시</title><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect width="960" height="226" rx="18" fill="#f3f7fa"/><rect x="0" y="20" width="6" height="186" rx="3" fill="#176c70"/><text x="28" y="46" font-size="26" font-weight="700" fill="#1e3044">실시간 입력과 게시</text><text x="28" y="77" font-size="15" font-weight="400" fill="#1e3044">계측 흐름 도식 · 세대가 바뀌면 이전 승인과 결과를 폐기한다.</text><rect x="28" y="110" width="204" height="90" rx="10" fill="white" stroke="#176c70"/><text x="42" y="143" font-size="20" font-weight="700" fill="#176c70">캡처</text><text x="42" y="171" font-size="14" font-weight="400" fill="#1e3044">입력 시각과 화면 세대</text><text x="238" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="262" y="110" width="204" height="90" rx="10" fill="white" stroke="#3668a8"/><text x="276" y="143" font-size="20" font-weight="700" fill="#3668a8">GPU·CPU</text><text x="276" y="171" font-size="14" font-weight="400" fill="#1e3044">검출과 상태 계산</text><text x="472" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="496" y="110" width="204" height="90" rx="10" fill="white" stroke="#806391"/><text x="510" y="143" font-size="20" font-weight="700" fill="#806391">관측 확인</text><text x="510" y="171" font-size="14" font-weight="400" fill="#1e3044">유효성과 신선도</text><text x="706" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="730" y="110" width="204" height="90" rx="10" fill="white" stroke="#a65139"/><text x="744" y="143" font-size="20" font-weight="700" fill="#a65139">게시</text><text x="744" y="171" font-size="14" font-weight="400" fill="#1e3044">독립 10초 주기</text></g></svg>
