<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 226" role="img"><title>관측 재생과 초기화 비교</title><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect width="960" height="226" rx="18" fill="#f3f7fa"/><rect x="0" y="20" width="6" height="186" rx="3" fill="#176c70"/><text x="28" y="46" font-size="26" font-weight="700" fill="#1e3044">관측 재생과 초기화 비교</text><text x="28" y="77" font-size="15" font-weight="400" fill="#1e3044">절차 도식 · 왼쪽부터 관측 설정, 입력, 결과, 검증 범위</text><rect x="28" y="110" width="204" height="90" rx="10" fill="white" stroke="#176c70"/><text x="42" y="143" font-size="20" font-weight="700" fill="#176c70">조건 고정</text><text x="42" y="171" font-size="14" font-weight="400" fill="#1e3044">시간 분할과 초기 상태</text><text x="238" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="262" y="110" width="204" height="90" rx="10" fill="white" stroke="#3668a8"/><text x="276" y="143" font-size="20" font-weight="700" fill="#3668a8">입력 재생</text><text x="276" y="171" font-size="14" font-weight="400" fill="#1e3044">관측 캐시 또는 원본</text><text x="472" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="496" y="110" width="204" height="90" rx="10" fill="white" stroke="#806391"/><text x="510" y="143" font-size="20" font-weight="700" fill="#806391">결과 비교</text><text x="510" y="171" font-size="14" font-weight="400" fill="#1e3044">연속 운용과 재시작</text><text x="706" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="730" y="110" width="204" height="90" rx="10" fill="white" stroke="#a65139"/><text x="744" y="143" font-size="20" font-weight="700" fill="#a65139">한계 기록</text><text x="744" y="171" font-size="14" font-weight="400" fill="#1e3044">개발 자료와 독립 자료</text></g></svg>
