<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 226" role="img"><title>독립 검토와 사후 평가</title><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect width="960" height="226" rx="18" fill="#f3f7fa"/><rect x="0" y="20" width="6" height="186" rx="3" fill="#176c70"/><text x="28" y="46" font-size="26" font-weight="700" fill="#1e3044">독립 검토와 사후 평가</text><text x="28" y="77" font-size="15" font-weight="400" fill="#1e3044">절차 도식 · 추론이 사람 답변 파일을 열지 않도록 분리한다.</text><rect x="28" y="110" width="204" height="90" rx="10" fill="white" stroke="#176c70"/><text x="42" y="143" font-size="20" font-weight="700" fill="#176c70">사전 등록</text><text x="42" y="171" font-size="14" font-weight="400" fill="#1e3044">영상·설정·모델 해시</text><text x="238" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="262" y="110" width="204" height="90" rx="10" fill="white" stroke="#3668a8"/><text x="276" y="143" font-size="20" font-weight="700" fill="#3668a8">직접 검토</text><text x="276" y="171" font-size="14" font-weight="400" fill="#1e3044">예측을 숨긴 채 기록</text><text x="472" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="496" y="110" width="204" height="90" rx="10" fill="white" stroke="#806391"/><text x="510" y="143" font-size="20" font-weight="700" fill="#806391">예측 봉인</text><text x="510" y="171" font-size="14" font-weight="400" fill="#1e3044">고정 추론 일정</text><text x="706" y="161" font-size="16" font-weight="400" fill="#1e3044">→</text><rect x="730" y="110" width="204" height="90" rx="10" fill="white" stroke="#a65139"/><text x="744" y="143" font-size="20" font-weight="700" fill="#a65139">사후 비교</text><text x="744" y="171" font-size="14" font-weight="400" fill="#1e3044">카메라·Local·PTS</text></g></svg>
