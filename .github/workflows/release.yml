name: Build GitHub Release

on:
  push:
    branches: [main]
    paths:
      - release_trigger.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            app.py \
            research_history.py \
            update_manager.py \
            update_helper.py \
            transition_refiner_v164.py \
            validation_center.py \
            public_dataset.py \
            research_capture.py \
            detector_tuner.py
          python -m json.tool research_history.json >/dev/null
          VERSION="$(tr -d '\r\n' < VERSION.txt)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NAME=ParkingResearchAgent-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r "dist/$NAME" .             -x ".git/*" ".github/*" "bundle/*" "dist/*"                "__pycache__/*" "work/*" "output/*" "user_data/*"                ".venv/*" "LAST_ERROR.txt" "release_trigger.txt"
          (
            cd dist
            sha256sum "$NAME" > "$NAME.sha256"
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "dist/$NAME" "dist/$NAME.sha256" --clobber
          else
            gh release create "$VERSION"               "dist/$NAME"               "dist/$NAME.sha256"               --target main               --title "Parking Research Agent $VERSION"               --notes-file RELEASE_NOTES.md
          fi
